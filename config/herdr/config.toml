onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
toggle_sidebar = "option+shift+b"
detach = "option+shift+q"
reload_config = "option+shift+e"
remote_image_paste = "option+shift+v"

focus_pane_left = ["option+shift+left"]
focus_pane_down = ["option+shift+down"]
focus_pane_up = ["option+shift+up"]
focus_pane_right = ["option+shift+right"]

split_vertical = ["option+shift+d"]
split_horizontal = ["option+shift+c"]
close_pane = ["option+shift+x"]
resize_mode = "option+shift+r"

new_tab = ["option+shift+t"]
previous_tab = ["option+shift+comma"]
next_tab = ["option+shift+period"]
close_tab = ["option+shift+w"]

last_pane = ["prefix+tab"]

[ui]
prompt_new_tab_name = false

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[remote]
manage_ssh_config = true

[advanced]
scrollback_limit_bytes = 10000000

[session]
resume_agents_on_restore = true

[update]
channel = "preview"

[experimental]
switch_ascii_input_source_in_prefix = false
