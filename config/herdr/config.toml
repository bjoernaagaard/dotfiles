onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "alt+space"

# Left Alt is Herdr's management modifier. Physical Windows remains free for apps.
focus_pane_left = ["alt+left", "prefix+left"]
focus_pane_down = ["alt+down", "prefix+down"]
focus_pane_up = ["alt+up", "prefix+up"]
focus_pane_right = ["alt+right", "prefix+right"]

split_vertical = ["alt+shift+d", "prefix+v"]
split_horizontal = [
    "alt+shift+c",
    "prefix+minus",
]
close_pane = ["alt+shift+x", "prefix+x"]
zoom = ["alt+z", "prefix+z"]
resize_mode = "prefix+r"

new_tab = ["alt+shift+t", "prefix+c"]
previous_tab = ["alt+comma", "prefix+p"]
next_tab = ["alt+period", "prefix+n"]
switch_tab = "prefix+1..9"
close_tab = ["alt+shift+w", "prefix+shift+x"]

workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"
last_pane = "prefix+tab"

toggle_sidebar = "prefix+b"
detach = "prefix+q"
reload_config = "prefix+shift+r"
remote_image_paste = "alt+v"

[[keys.command]] # open in a split beside your work
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]] # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[theme]
name = "nord"
auto_switch = true

[ui]
sidebar_width = 24
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_collapsed_mode = "compact"
confirm_close = true
prompt_new_tab_name = false
mouse_capture = true
right_click_passthrough_modifier = "alt"
redraw_on_focus_gained = true
mouse_scroll_lines = 3
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
agent_panel_scope = "all"
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[remote]
manage_ssh_config = true

[advanced]
allow_nested = false
scrollback_limit_bytes = 10000000

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = false

[session]
resume_agents_on_restore = true
