onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "option+space"
toggle_sidebar = "option+b"
detach = "option+q"
reload_config = "option+shift+r"
remote_image_paste = "option+v"

focus_pane_left = ["option+left"]
focus_pane_down = ["option+down"]
focus_pane_up = ["option+up"]
focus_pane_right = ["option+right"]

split_vertical = ["option+d"]
split_horizontal = ["option+c"]
close_pane = ["option+x"]
resize_mode = "option+r"

new_tab = ["option+t"]
previous_tab = ["option+comma"]
next_tab = ["option+period"]
close_tab = ["option+w"]

last_pane = ["prefix+tab"]

[[keys.command]]
key = "option+o"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]
key = "option+shift+o"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[theme]
name = "nord"
auto_switch = true

[ui]
sidebar_width = 24
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_collapsed_mode = "compact"
confirm_close = true
prompt_new_tab_name = false
mouse_capture = true
right_click_passthrough_modifier = "option"
redraw_on_focus_gained = true
mouse_scroll_lines = 3
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
hide_tab_bar_when_single_tab = false
agent_panel_scope = "all"
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = true

[remote]
manage_ssh_config = true

[advanced]
allow_nested = false
scrollback_limit_bytes = 10000000

[experimental]
switch_ascii_input_source_in_prefix = true
pane_history = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "pi", "codex"]

[session]
resume_agents_on_restore = true

[update]
channel = "preview"
