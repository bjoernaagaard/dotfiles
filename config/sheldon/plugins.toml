shell = "zsh"

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
profiles = ["post-compinit"]

# fzf-tab must load before plugins that wrap widgets (zsh-autosuggestions,
# fast-syntax-highlighting) but after compinit, so it stays at the top of
# the post-compinit group.
[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
profiles = ["post-compinit"]

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
profiles = ["pre-compinit"]

[plugins.zsh-history-substring-search]
github = "zsh-users/zsh-history-substring-search"
profiles = ["post-compinit"]

[plugins.zsh-abbr]
github = "olets/zsh-abbr"
profiles = ["post-compinit"]

[plugins.forgit]
github = "wfxr/forgit"
use = ["forgit.plugin.zsh"]
apply = ["source"]
profiles = ["post-compinit"]

[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"
profiles = ["post-compinit"]

# fast-syntax-highlighting replaces zsh-syntax-highlighting. Never load both.
[plugins.fast-syntax-highlighting]
github = "zdharma-continuum/fast-syntax-highlighting"
profiles = ["post-compinit"]
