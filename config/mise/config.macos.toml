[bootstrap.packages]
"brew:git" = "latest"
"brew:gnu-getopt" = "latest"
"brew:gnu-tar" = "latest"
"brew:htop" = "latest"
"brew:openssh" = "latest"
"brew:wakeonlan" = "latest"
"brew:yubico-piv-tool" = "latest"
"brew:tailscale" = "latest"
"brew:mole" = "latest"
"brew:glow" = "latest"
"brew:git-delta" = "latest"
"brew:zsh" = "latest"
"brew:rage" = "latest"

[bootstrap.macos.keyboard]
key_repeat = 1
initial_key_repeat = 10
press_and_hold = false

[bootstrap.macos.launchd.agents.caps-lock-delay]
program = "/usr/bin/hidutil"
args = ["property", "--set", '{"CapsLockDelayOverride":0}']
run_at_load = true
kickstart = true

[bootstrap.macos.launchd.agents.deepseek-tool-proxy]
# Rewrites Droid's BYOK Responses-API custom tool name ApplyPatch -> apply_patch
# (DeepSeek rejects any other name with 400) before forwarding to api.deepseek.com.
# Script lives in ~/.dotfiles/bin (provisioned via [dotfiles] symlink below);
# /bin/sh -c expands $HOME because launchd does not expand ~ or env vars in plists.
program = "/bin/sh"
args = [
  "-c",
  "exec /usr/bin/python3 \"$HOME/.factory/bin/deepseek-tool-proxy.py\""
]
run_at_load = true
keep_alive = true
stdout_path = "~/.factory/logs/deepseek-tool-proxy.log"
stderr_path = "~/.factory/logs/deepseek-tool-proxy.log"
kickstart = true

[bootstrap.brew.taps]
"nikitabobko/tap" = "https://github.com/nikitabobko/homebrew-tap.git"
"FelixKratz/formulae" = "https://github.com/FelixKratz/homebrew-formulae.git"

[tasks.bootstrap]
description = "Ensure Homebrew taps for optional window-manager tools"
run = """
brew tap nikitabobko/tap
brew tap FelixKratz/formulae
"""

[dotfiles]
"~/.config/aerospace/aerospace.toml" = { source = "~/.dotfiles/config/aerospace/aerospace.toml", mode = "symlink" }
"~/.config/sketchybar" = { source = "~/.dotfiles/config/sketchybar", mode = "symlink" }
"~/.config/borders/bordersrc" = { source = "~/.dotfiles/config/borders/bordersrc", mode = "symlink" }
"~/.config/karabiner" = { source = "~/.dotfiles/config/karabiner", mode = "symlink" }
"~/.factory/bin/deepseek-tool-proxy.py" = { source = "~/.dotfiles/bin/deepseek-tool-proxy.py", mode = "symlink" }
"~/Library/Application Support/Code/User/settings.json" = { source = "~/.dotfiles/Library/Application Support/Code/User/settings.json", mode = "symlink" }
"~/Library/Application Support/Code/User/keybindings.json" = { source = "~/.dotfiles/Library/Application Support/Code/User/keybindings.json", mode = "symlink" }
