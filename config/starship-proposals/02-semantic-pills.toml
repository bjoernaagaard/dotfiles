# Proposal 02 — Semantic Pills
# Independent modules stay visually complete when their neighbors disappear.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 500
scan_timeout = 30
palette = "pills"

format = """\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$jobs\
$status\
$hostname\
$character"""

right_format = """\
$cmd_duration\
$python\
$username\
$time"""

[palettes.pills]
ink = "#d4d4d4"
on_fill = "#141414"
meta = "#3a3a3a"
path = "#87a6c4"
vcs = "#b48ead"
change = "#88c0d0"
context = "#70b489"
attention = "#f1b467"
alert = "#fc6b83"

[directory]
format = "[](fg:path)[ $path$read_only ](fg:on_fill bg:path)[](fg:path)"
read_only = " "
read_only_style = "fg:on_fill bg:path"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
home_symbol = "~"

[git_branch]
format = " [](fg:vcs)[ $symbol$branch ](fg:on_fill bg:vcs)[](fg:vcs)"
symbol = " "
truncation_length = 32
truncation_symbol = "…"
only_attached = true

[git_commit]
format = " [](fg:vcs)[ detached $hash ](fg:on_fill bg:vcs)[](fg:vcs)"
only_detached = true
commit_hash_length = 7

[git_state]
format = " [](fg:attention)[ $state( $progress_current/$progress_total) ](fg:on_fill bg:attention)[](fg:attention)"

[git_status]
format = "([ ](fg:change)[ $all_status$ahead_behind ](fg:on_fill bg:change)[](fg:change))"
conflicted = "⇌"
deleted = "x"
renamed = "»"
modified = "!"
staged = "+"
untracked = "?"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""

[jobs]
threshold = 1
format = " [](fg:attention)[ $number jobs ](fg:on_fill bg:attention)[](fg:attention)"

[status]
disabled = false
format = " [](fg:alert)[ exit $status ](fg:on_fill bg:alert)[](fg:alert)"
symbol = ""
success_symbol = ""
map_symbol = false
recognize_signal_code = true

[hostname]
ssh_only = true
format = " [](fg:alert)[ $ssh_symbol$hostname ](fg:on_fill bg:alert)[](fg:alert)"
ssh_symbol = " "
trim_at = "."

[character]
format = " $symbol"
success_symbol = "[❯](fg:ink)"
error_symbol = "[❯](fg:alert)"

[cmd_duration]
format = "[](fg:attention)[ $duration ](fg:on_fill bg:attention)[](fg:attention) "
min_time = 2000
show_milliseconds = false

[python]
format = "[](fg:context)[ $virtualenv ](fg:on_fill bg:context)[](fg:context) "
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]
generic_venv_names = [".venv", "venv"]
python_binary = [["mise", "exec", "--", "python"]]

[username]
show_always = false
format = "[](fg:meta)[ $user ]($style)[](fg:meta) "
style_user = "fg:ink bg:meta"
style_root = "fg:ink bg:meta"

[time]
disabled = false
format = "[](fg:meta)[ $time ](fg:ink bg:meta)[](fg:meta)"
time_format = "%H:%M"
