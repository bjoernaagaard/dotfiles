# Proposal 01 — Minimal Signal
# Quiet by default; detailed only when context needs attention.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
palette = "signal"

format = """\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$jobs\
$status\
$character"""

right_format = """\
$cmd_duration\
$python\
$username\
$hostname\
$time"""

[palettes.signal]
path = "#87a6c4"
vcs = "#70b489"
attention = "#f1b467"
error = "#fc6b83"
identity = "#b48ead"
duration = "#88c0d0"
muted = "#8f969e"
text = "#d4d4d4"

[directory]
format = "[$path](fg:path)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " ro"
read_only_style = "fg:error"

[git_branch]
format = "[git:$branch](fg:vcs) "
truncation_length = 32
truncation_symbol = "…"
only_attached = true

[git_commit]
format = "[git:$hash](fg:vcs) "
only_detached = true
commit_hash_length = 7

[git_state]
format = "[$state( $progress_current/$progress_total)](fg:attention) "

[git_status]
format = "([$all_status$ahead_behind](fg:vcs) )"
conflicted = "="
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "x"
typechanged = "~"
stashed = "*"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""

[jobs]
threshold = 1
format = "[jobs:$number](fg:attention) "

[status]
disabled = false
format = "[exit:$status](fg:error) "
symbol = ""
success_symbol = ""
map_symbol = false
recognize_signal_code = true

[character]
success_symbol = "[>](fg:text)"
error_symbol = "[>](fg:error)"

[cmd_duration]
format = "[$duration](fg:duration) "
min_time = 5000
show_milliseconds = false

[python]
format = "[venv:$virtualenv](fg:attention) "
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]
python_binary = [["mise", "exec", "--", "python"]]

[username]
show_always = false
format = "[$user]($style)"
style_user = "fg:identity"
style_root = "fg:error"

[hostname]
ssh_only = true
format = "[@$hostname](fg:identity) "
ssh_symbol = ""
trim_at = "."

[time]
disabled = false
format = "[$time](fg:muted) "
time_format = "%H:%M"
