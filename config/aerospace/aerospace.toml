config-version = 2
start-at-login = false
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
focus-follows-mouse.enabled = false
on-focused-monitor-changed = []
persistent-workspaces = ["1", "2", "3"]

key-mapping.preset = "qwerty"

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# On the K10, the physical key labelled Alt is translated by the existing
# Karabiner setup to the modifier AeroSpace spells `ctrl`.
ctrl-h = "focus left"
ctrl-j = "focus down"
ctrl-k = "focus up"
ctrl-l = "focus right"

ctrl-shift-h = "move left"
ctrl-shift-j = "move down"
ctrl-shift-k = "move up"
ctrl-shift-l = "move right"

ctrl-1 = "workspace 1"
ctrl-2 = "workspace 2"
ctrl-3 = "workspace 3"
ctrl-shift-1 = "move-node-to-workspace 1"
ctrl-shift-2 = "move-node-to-workspace 2"
ctrl-shift-3 = "move-node-to-workspace 3"

ctrl-minus = "resize smart -50"
ctrl-equal = "resize smart +50"
ctrl-slash = "layout tiles horizontal vertical"
ctrl-comma = "layout accordion horizontal vertical"
ctrl-f = "fullscreen"
ctrl-shift-space = "layout floating tiling"
ctrl-r = "reload-config"

ctrl-shift-semicolon = "mode service"

[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"]
f = ["layout floating tiling", "mode main"]
