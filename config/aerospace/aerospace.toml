config-version = 2
start-at-login = true
auto-reload-config = true

after-startup-command = [
  # SketchyBar has built-in detection for an already-running instance, so it
  # is safe to keep this here even when it is also managed by brew services.
  'exec-and-forget sketchybar',
  # Optional focused-window borders. The guard keeps AeroSpace startup clean
  # on machines where the `borders` add-on has not been installed.
  'exec-and-forget /bin/sh -c "command -v borders >/dev/null 2>&1 && exec borders"',
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE="$AEROSPACE_FOCUSED_WORKSPACE" PREV_WORKSPACE="$AEROSPACE_PREV_WORKSPACE"',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
focus-follows-mouse.enabled = false
on-focused-monitor-changed = []
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

key-mapping.preset = "qwerty"

[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[mode.main.binding]
# On the K10, Karabiner swaps the physical Ctrl and Command/Windows keys.
# AeroSpace therefore sees the physical Command/Windows key as `ctrl`.
ctrl-h = "focus left"
ctrl-j = "focus down"
ctrl-k = "focus up"
ctrl-l = "focus right"

ctrl-shift-h = "move left"
ctrl-shift-j = "move down"
ctrl-shift-k = "move up"
ctrl-shift-l = "move right"

ctrl-1 = "workspace 1"
ctrl-2 = "workspace 2"
ctrl-3 = "workspace 3"
ctrl-4 = "workspace 4"
ctrl-5 = "workspace 5"
ctrl-6 = "workspace 6"
ctrl-7 = "workspace 7"
ctrl-8 = "workspace 8"
ctrl-9 = "workspace 9"
ctrl-shift-1 = "move-node-to-workspace 1"
ctrl-shift-2 = "move-node-to-workspace 2"
ctrl-shift-3 = "move-node-to-workspace 3"
ctrl-shift-4 = "move-node-to-workspace 4"
ctrl-shift-5 = "move-node-to-workspace 5"
ctrl-shift-6 = "move-node-to-workspace 6"
ctrl-shift-7 = "move-node-to-workspace 7"
ctrl-shift-8 = "move-node-to-workspace 8"
ctrl-shift-9 = "move-node-to-workspace 9"

ctrl-minus = "resize smart -50"
ctrl-equal = "resize smart +50"
ctrl-slash = "layout tiles horizontal vertical"
ctrl-comma = "layout accordion horizontal vertical"
ctrl-f = "fullscreen"
ctrl-shift-space = "layout floating tiling"
ctrl-r = "reload-config"

ctrl-shift-semicolon = "mode service"

[mode.service.binding]
esc = ["reload-config", "mode main"]
r = ["flatten-workspace-tree", "mode main"]
f = ["layout floating tiling", "mode main"]

# GUI-launched AeroSpace does not always inherit the shell's Homebrew path.
# Include both Homebrew layouts so callbacks work on Apple Silicon and Intel.
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:${PATH}'
