config-version = 2
start-at-login = true
auto-reload-config = true

on-window-detected = [
  { if.app-id = "com.mitchellh.ghostty", run = [
    "layout tiling",
  ] },
  { if.app-id = "com.apple.ActivityMonitor", run = [
    "layout floating",
  ] },
  { if.app-id = "com.apple.systempreferences", run = [
    "layout floating",
  ] },
  { if.app-id = "com.apple.finder", run = [
    "layout floating",
  ] },
]

after-startup-command = [
  "exec-and-forget sketchybar >> $HOME/.sketchybar/service.log 2>&1",
  "exec-and-forget borders",
]

exec-on-workspace-change = [
  "/bin/bash",
  "-c",
  "sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE"
]

on-focus-changed = [
  "exec-and-forget sketchybar --trigger aerospace_focus_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE",
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = "tiles"
default-root-container-orientation = "auto"
focus-follows-mouse.enabled = false
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

key-mapping.preset = "qwerty"

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 36
outer.right = 10

[mode.main.binding]
# ctrl-t = "exec-and-forget code start"

cmd-h = []  # Disable "hide application"
cmd-ctrl-h = []  # Disable "hide others"

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
ctrl-slash = "layout tiles horizontal vertical"
ctrl-comma = "layout accordion horizontal vertical"

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
ctrl-left = "focus left"
ctrl-down = "focus down"
ctrl-up = "focus up"
ctrl-right = "focus right"

# See: https://nikitabobko.github.io/AeroSpace/commands#move
ctrl-shift-left = "move left"
ctrl-shift-down = "move down"
ctrl-shift-up = "move up"
ctrl-shift-right = "move right"

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
ctrl-shift-minus = "resize smart -50"
ctrl-shift-equal = "resize smart +50"
ctrl-shift-g = "reload-config"

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
ctrl-1 = "workspace 1"
ctrl-2 = "workspace 2"
ctrl-3 = "workspace 3"
ctrl-4 = "workspace 4"
ctrl-5 = "workspace 5"
ctrl-6 = "workspace 6"
ctrl-7 = "workspace 7"
ctrl-8 = "workspace 8"
ctrl-9 = "workspace 9"

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
ctrl-shift-1 = "move-node-to-workspace 1 --focus-follows-window"
ctrl-shift-2 = "move-node-to-workspace 2 --focus-follows-window"
ctrl-shift-3 = "move-node-to-workspace 3 --focus-follows-window"
ctrl-shift-4 = "move-node-to-workspace 4 --focus-follows-window"
ctrl-shift-5 = "move-node-to-workspace 5 --focus-follows-window"
ctrl-shift-6 = "move-node-to-workspace 6 --focus-follows-window"
ctrl-shift-7 = "move-node-to-workspace 7 --focus-follows-window"
ctrl-shift-8 = "move-node-to-workspace 8 --focus-follows-window"
ctrl-shift-9 = "move-node-to-workspace 9 --focus-follows-window"

ctrl-shift-semicolon = [
  "mode service",
  "exec-and-forget sketchybar --trigger aerospace_enter_service_mode",
]

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
ctrl-tab = "exec-and-forget  aerospace list-workspaces --monitor focused --empty no | aerospace workspace --stdin next"
ctrl-shift-tab = "exec-and-forget  aerospace list-workspaces --monitor focused --empty no | aerospace workspace --stdin prev"

ctrl-shift-f = "fullscreen"
ctrl-shift-s = "layout v_accordion"
ctrl-shift-r = "mode resize"

[mode.resize.binding]
h = "resize width -50"
j = "resize height +50"
k = "resize height -50"
l = "resize width +50"
enter = "mode main"
esc = "mode main"

# GUI-launched AeroSpace does not always inherit the shell's Homebrew path.
# Include both Homebrew layouts so callbacks work on Apple Silicon and Intel.
[exec.env-vars]
PATH = "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:${PATH}"
