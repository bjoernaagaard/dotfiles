add_newline = true
command_timeout = 1000
format = "$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$cmd_duration$status$character"

[username]
show_always = false
format = "[$user]($style)"
style_user = "dimmed white"
style_root = "bold red"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "dimmed white"

[directory]
truncation_length = 4
style = "bold blue"

[git_branch]
symbol = "git:"
format = "[$symbol$branch]($style) "
style = "purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "yellow"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "x${count}"
renamed = "r${count}"
conflicted = "~${count}"
stashed = "*${count}"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"

[nodejs]
symbol = "node:"
format = "[$symbol$version]($style) "
style = "dimmed white"

[python]
symbol = "py:"
format = "[$symbol$version(/$virtualenv)]($style) "
style = "dimmed white"

[rust]
symbol = "rs:"
format = "[$symbol$version]($style) "
style = "dimmed white"

[golang]
symbol = "go:"
format = "[$symbol$version]($style) "
style = "dimmed white"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "dimmed white"

[status]
disabled = false
format = "[exit:$status]($style) "
style = "bold red"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
